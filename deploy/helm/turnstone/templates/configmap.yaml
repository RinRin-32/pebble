apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "turnstone.fullname" . }}-config
  labels:
    {{- include "turnstone.labels" . | nindent 4 }}
data:
  PEBBLE_DB_BACKEND: {{ .Values.database.backend | quote }}
  PEBBLE_DB_HOST: {{ include "turnstone.postgresql.host" . | quote }}
  PEBBLE_DB_PORT: {{ include "turnstone.postgresql.port" . | quote }}
  PEBBLE_DB_NAME: {{ include "turnstone.postgresql.database" . | quote }}
  PEBBLE_DB_USER: {{ include "turnstone.postgresql.username" . | quote }}
  PEBBLE_SERVER_HOST: "0.0.0.0"
  PEBBLE_SERVER_PORT: {{ .Values.server.service.port | quote }}
  PEBBLE_CONSOLE_HOST: "0.0.0.0"
  PEBBLE_CONSOLE_PORT: {{ .Values.console.service.port | quote }}
  PEBBLE_POLL_INTERVAL: "5"
  {{- if .Values.llm.baseUrl }}
  PEBBLE_LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  {{- end }}
  PEBBLE_LLM_PROVIDER: {{ .Values.llm.provider | quote }}
