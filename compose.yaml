# =============================================================================
# Turnstone — local cluster stack (docker compose)
#
# Clone the repo and run:
#
#     docker compose up
#
# That builds one image and brings up a complete, console-visible cluster:
# PostgreSQL + console + Caddy + channel gateway + 10 server nodes (node-1…10).
#
#   Dashboard: https://localhost:8443   (Caddy's local CA — trust it once)
#
# Access is via Caddy only — the console's plain-HTTP port is intentionally not
# published (HTTP/2 from Caddy avoids the browser's 6-connection cap on the
# dashboard's SSE streams). Trust Caddy's root once:
#     docker compose exec caddy cat /data/caddy/pki/authorities/local/root.crt
#
# It works out of the box with INSECURE dev defaults (see the secret/password
# values below) so there's nothing to configure first. A .env file still
# overrides any value. For a real deployment use the bundled production stack
# at pebble/deploy/compose.yaml — it pulls released images from ghcr.io and
# requires you to set real secrets.
#
# Bring your own LLM: nodes boot without one and show up in the console
# immediately. Add model backends (OpenAI / Anthropic / local vLLM) from the
# console UI's Models tab, or point LLM_BASE_URL / OPENAI_API_KEY (below) at an
# OpenAI-compatible endpoint.
#
# Fewer nodes (lighter machines):
#     docker compose up postgres console caddy channel node-1 node-2 node-3
#
# Join a bare-metal host: a pebble-server running OUTSIDE compose (e.g. to use
# a local GPU) can join this cluster. Postgres, the console's ACME endpoint, and
# SearxNG are published on 127.0.0.1 so a node on THIS machine reaches them via
# localhost. Keep secrets in ~/.config/pebble/config.toml (chmod 0600 — the
# loader warns otherwise):
#     [auth]
#     jwt_secret = "dev-only-insecure-jwt-secret-change-me-for-real-deployments"
#     [database]
#     backend = "postgresql"
#     url = "postgresql+psycopg://turnstone:turnstone@localhost:5432/turnstone"
#     [api]
#     base_url = "http://localhost:8000/v1"
#     api_key = "dummy"
#     [tls]              # only if the cluster runs mTLS
#     enabled = true
# then run (node identity isn't a secret, so it stays on the command line):
#     PEBBLE_NODE_ID=host-1 \
#       PEBBLE_ADVERTISE_URL=http://host.docker.internal:8080 \
#       PEBBLE_CONSOLE_URL=http://localhost:8090 \
#       PEBBLE_SEARXNG_URL=http://localhost:8081 \
#       pebble-server --host 0.0.0.0 --port 8080
# The node registers in Postgres, auto-enrolls its mTLS cert from the console's
# ACME endpoint (when the cluster runs mTLS), and the console collector reaches
# it back via host.docker.internal. To join from ANOTHER machine, set
# PEBBLE_HOST_IP to this host's LAN IP and use it in the URLs above (and the
# node's PEBBLE_ADVERTISE_URL = the NODE host's IP) — see docs/docker.md.
# =============================================================================

# NOTE: the project name prefixes every container and volume
# (turnstone_postgres-data, pebble-console-1).  It is deliberately
# NOT renamed to pebble: doing so orphans the existing volumes, which
# means losing the database for a purely cosmetic change.
name: turnstone

networks:
  turnstone-net:
    driver: bridge

volumes:
  turnstone-data:
  workspace:
  nix-store:
  postgres-data:
  caddy-data:
  caddy-config:
  searxng-cache:

# -- Shared values (scalar anchors) -------------------------------------------
# Defined once here, referenced (*alias) by every service so the dev defaults
# can't drift. All `${VAR:-default}` values are still overridable via .env.
x-shared:
  # INSECURE dev default. Every service MUST share ONE secret — the console
  # mints its own service token (signed with this) to reach the nodes. Override
  # PEBBLE_JWT_SECRET in .env for anything that isn't a local sandbox.
  jwt-secret: &jwt-secret "${PEBBLE_JWT_SECRET:-${TURNSTONE_JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-for-real-deployments}}"
  # Git identity + push credentials for dispatched coding work.  A FINE-GRAINED
  # token scoped to the repos pebble is bound to — not the operator's personal
  # gh login, which would give every agent push rights to everything they own.
  # Encrypts per-user secrets pebble stores (git push tokens today).  Without
  # it those cannot be stored at all — deliberately, since the alternative is
  # keeping them in plaintext next to the data they protect.
  secret-key: &secret-key "${PEBBLE_SECRET_KEY:-}"
  git-token: &git-token "${PEBBLE_GIT_TOKEN:-${GITHUB_TOKEN:-}}"
  git-host: &git-host "${PEBBLE_GIT_HOST:-github.com}"
  git-author-name: &git-author-name "${PEBBLE_GIT_AUTHOR_NAME:-pebble}"
  git-author-email: &git-author-email "${PEBBLE_GIT_AUTHOR_EMAIL:-pebble@users.noreply.github.com}"
  db-backend: &db-backend "${PEBBLE_DB_BACKEND:-${TURNSTONE_DB_BACKEND:-postgresql}}"
  # All services point at the same Postgres. Node discovery REQUIRES a shared
  # DB: each server registers + heartbeats into a `services` table that the
  # console polls. (SQLite-per-container can't see other containers.)
  db-url: &db-url "${PEBBLE_DB_URL:-${TURNSTONE_DB_URL:-postgresql+psycopg://${POSTGRES_USER:-turnstone}:${POSTGRES_PASSWORD:-turnstone}@postgres:5432/turnstone}}"

services:
  # -------------------------------------------------------------------
  # PostgreSQL — the shared database that ties the cluster together.
  # -------------------------------------------------------------------
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: turnstone
      POSTGRES_USER: ${POSTGRES_USER:-turnstone}
      # INSECURE dev default — override POSTGRES_PASSWORD in .env for real use.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnstone}
      PGDATA: /var/lib/postgresql/data
    # Published so a bare-metal pebble-server can join the cluster (see "Join
    # a bare-metal host" in the header). Bound to 127.0.0.1 by default (same-host
    # nodes only); set PEBBLE_HOST_IP to this host's LAN IP to let another
    # machine connect — but set a real POSTGRES_PASSWORD first, or you'll expose a
    # database with the insecure default password to your network. (The legacy
    # POSTGRES_BIND is still honored as a fallback when PEBBLE_HOST_IP is unset.)
    ports:
      - "${PEBBLE_HOST_IP:-${TURNSTONE_HOST_IP:-${POSTGRES_BIND:-127.0.0.1}}}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - turnstone-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turnstone}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  # -------------------------------------------------------------------
  # nix-init — populates the shared Nix store ONCE, then exits.
  #
  # The store is a volume rather than an image layer so toolchains downloaded by
  # setup_env survive rebuilds. It cannot be seeded by mounting the volume over
  # an image's /nix: Docker copies image content into a fresh volume, and several
  # nodes doing that concurrently collide ("mkdir ... file exists"). One writer
  # that completes first removes the race entirely.
  # -------------------------------------------------------------------
  nix-init:
    image: nixos/nix:latest
    command:
      - sh
      - -c
      - >-
        if [ ! -d /nixvol/var/nix ]; then
          echo "seeding nix store..." && cp -a /nix/. /nixvol/;
        fi;
        chown -R 1000:1000 /nixvol && echo "nix store ready"
    volumes:
      - nix-store:/nixvol
    networks:
      - turnstone-net
    restart: "no"

  # -------------------------------------------------------------------
  # pebble-console — cluster dashboard. Reach it ONLY through Caddy at
  # https://localhost:8443 (see the caddy service below).
  #
  # Browsers must reach the dashboard through Caddy (https://localhost:8443): a
  # plain HTTP/1.1 origin caps the browser at 6 connections, which starves the
  # dashboard's per-pane SSE streams, whereas Caddy serves HTTP/2 (multiplexed)
  # and proxies to console:8090 internally. The console's :8090 is published
  # below ONLY so bare-metal nodes can reach the plain-HTTP ACME enrollment
  # endpoint — don't point a browser at it.
  #
  # The single `build:` here produces the pebble:local image every other
  # service reuses. extra_hosts lets the console reach a bare-metal server
  # advertising http://host.docker.internal:8080 (see "Join a host" below).
  # -------------------------------------------------------------------
  console:
    image: pebble:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - pebble-console
      - --host=0.0.0.0
      - --port=8090
    # Publishes the console's plain-HTTP listener so a bare-metal node can reach
    # the ACME endpoint, fetch the CA, and enroll its cert (the console serves
    # HTTP here even under mTLS). Bound to 127.0.0.1 by default; setting
    # PEBBLE_HOST_IP exposes the WHOLE console HTTP API — including the
    # cert-issuing ACME endpoint — on that interface, so the JWT secret's
    # strength is the only gate. Browsers use Caddy :8443, never this port.
    ports:
      - "${PEBBLE_HOST_IP:-${TURNSTONE_HOST_IP:-127.0.0.1}}:8090:8090"
    environment:
      PEBBLE_JWT_SECRET: *jwt-secret
      PEBBLE_SECRET_KEY: *secret-key
      PEBBLE_GIT_TOKEN: *git-token
      PEBBLE_GIT_HOST: *git-host
      PEBBLE_GIT_AUTHOR_NAME: *git-author-name
      PEBBLE_GIT_AUTHOR_EMAIL: *git-author-email
      PEBBLE_DB_BACKEND: *db-backend
      PEBBLE_DB_URL: *db-url
      PEBBLE_CONSOLE_URL: http://console:8090
    volumes:
      # The console serves the knowledge MCP mount, so it needs the vault it
      # is serving.  It previously had no /workspace at all — only nodes did,
      # which is why the admin panel reads the derived DB index rather than
      # the note files.
      - ${WORKSPACE_MOUNT:-workspace}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - turnstone-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # caddy — browser TLS for the console dashboard.
  # Terminates HTTPS (Caddy's own local CA, see pebble/deploy/Caddyfile) → console:8090.
  # Dashboard over TLS: https://localhost:${CONSOLE_HTTPS_PORT:-8443}
  # -------------------------------------------------------------------
  caddy:
    image: caddy:2.11
    depends_on:
      - console
    ports:
      - "${CONSOLE_HTTPS_PORT:-8443}:443"
      # Plain HTTP for Tailscale Serve (terminates TLS, forwards HTTP here).
      - "127.0.0.1:${CONSOLE_HTTP_PORT:-8080}:80"
      # SearxNG web UI — localhost-only (it has no auth). Browse https://localhost:8444.
      - "127.0.0.1:${SEARXNG_HTTPS_PORT:-8444}:8444"
    volumes:
      - ./pebble/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # persist Caddy's local CA across restarts
      - caddy-config:/config
    networks:
      - turnstone-net
    restart: unless-stopped

  # -------------------------------------------------------------------
  # pebble-channel — channel gateway (Discord and/or Slack).
  # Runs HTTP-only with no adapters until you set a token, so it's safe
  # to leave running. See docs/channels.md.
  # -------------------------------------------------------------------
  channel:
    image: pebble:local
    command:
      - sh
      - -c
      - >-
        pebble-channel
        --http-host=0.0.0.0
        $${PEBBLE_DISCORD_GUILD:+--discord-guild $$PEBBLE_DISCORD_GUILD}
    environment:
      PEBBLE_JWT_SECRET: *jwt-secret
      PEBBLE_SECRET_KEY: *secret-key
      PEBBLE_GIT_TOKEN: *git-token
      PEBBLE_GIT_HOST: *git-host
      PEBBLE_GIT_AUTHOR_NAME: *git-author-name
      PEBBLE_GIT_AUTHOR_EMAIL: *git-author-email
      PEBBLE_DB_BACKEND: *db-backend
      PEBBLE_DB_URL: *db-url
      PEBBLE_DISCORD_TOKEN: ${PEBBLE_DISCORD_TOKEN:-${TURNSTONE_DISCORD_TOKEN:-}}
      PEBBLE_DISCORD_GUILD: ${PEBBLE_DISCORD_GUILD:-${TURNSTONE_DISCORD_GUILD:-0}}
      PEBBLE_SLACK_TOKEN: ${PEBBLE_SLACK_TOKEN:-${TURNSTONE_SLACK_TOKEN:-}}
      PEBBLE_SLACK_APP_TOKEN: ${PEBBLE_SLACK_APP_TOKEN:-${TURNSTONE_SLACK_APP_TOKEN:-}}
      PEBBLE_CHANNEL_ADVERTISE_URL: http://channel:8091
    networks:
      - turnstone-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------
  # searxng — self-hosted metasearch backing the web_search tool.
  # Internal-network only (no published port): nodes reach it at
  # http://searxng:8080. Config (JSON output on, limiter off) lives in
  # pebble/deploy/searxng/settings.yml, mounted read-only. Commercial
  # models use native provider search and never hit this; it serves
  # local/vLLM models. Override the tag with SEARXNG_IMAGE_TAG in .env.
  # -------------------------------------------------------------------
  searxng:
    image: searxng/searxng:${SEARXNG_IMAGE_TAG:-latest}
    # Published so a bare-metal node's web_search can reach it. SearxNG has NO
    # auth, so it is bound to 127.0.0.1 by default; setting PEBBLE_HOST_IP
    # exposes it on that interface — an open search proxy on your LAN, which also
    # triggers the SearxNG AGPL-3.0 §13 source-offer obligation (see docs/docker.md).
    # In-compose nodes always use the internal http://searxng:8080 and ignore this.
    ports:
      - "${PEBBLE_HOST_IP:-${TURNSTONE_HOST_IP:-127.0.0.1}}:${SEARXNG_API_PORT:-8081}:8080"
    volumes:
      - ./pebble/deploy/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng # favicon + internal SQLite cache (survives restarts)
    networks:
      - turnstone-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ===================================================================
  # Server fleet — node-1 … node-10
  #
  # Each node registers itself in Postgres on boot (unique
  # PEBBLE_NODE_ID + PEBBLE_ADVERTISE_URL) and the console
  # discovers it automatically — no static node list anywhere.
  #
  # node-1 carries the shared definition (&node / &node-env); node-2…10
  # inherit it and override only their identity.
  # ===================================================================
  node-1: &node
    image: pebble:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        pebble-server
        --host 0.0.0.0
        --port 8080
        --base-url "$${LLM_BASE_URL}"
        --api-key "$${OPENAI_API_KEY}"
        $${MODEL:+--model $$MODEL}
        $${SKIP_PERMISSIONS:+--skip-permissions}
        $${MCP_CONFIG:+--mcp-config $$MCP_CONFIG}
    volumes:
      - turnstone-data:/data
      - ${WORKSPACE_MOUNT:-workspace}:/workspace
      # Persistent Nix store, seeded once by nix-init.
      - nix-store:/nix
      # Agent credentials are NOT mounted here: the path is machine-specific and
      # a missing bind source makes Docker silently create a root-owned
      # directory, which breaks the login it was meant to supply.  Put them in
      # compose.override.yaml (gitignored, auto-merged) instead — see
      # docs/coding-dispatch.md, "Authentication".
    environment: &node-env
      PEBBLE_JWT_SECRET: *jwt-secret
      PEBBLE_SECRET_KEY: *secret-key
      PEBBLE_GIT_TOKEN: *git-token
      PEBBLE_GIT_HOST: *git-host
      PEBBLE_GIT_AUTHOR_NAME: *git-author-name
      PEBBLE_GIT_AUTHOR_EMAIL: *git-author-email
      PEBBLE_DB_BACKEND: *db-backend
      PEBBLE_DB_URL: *db-url
      # Bootstrap LLM defaults — real backends are configured in the console UI.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      # web_search backend. Defaults to the bundled searxng service; point at an
      # external SearxNG by setting PEBBLE_SEARXNG_URL in .env (empty disables).
      PEBBLE_SEARXNG_URL: ${PEBBLE_SEARXNG_URL:-${TURNSTONE_SEARXNG_URL:-http://searxng:8080}}
      MODEL: ${MODEL:-}
      MCP_CONFIG: ${MCP_CONFIG:-}
      SKIP_PERMISSIONS: ${SKIP_PERMISSIONS:-}
      # --- Coding-agent dispatch (dispatch_agent tool) -------------------
      # The agent CLIs ship in the image; only credentials come from here.
      # Claude Code runs with --bare, which deliberately does NOT read OAuth
      # logins or the host keychain, so it needs an API key:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # opencode reads provider keys from the environment too, and otherwise
      # falls back to ~/.local/share/opencode/auth.json inside the container.
      # To reuse your HOST login instead of issuing an API key, bind-mount the
      # auth file by adding this to the node volumes below (the file must
      # already exist, or Docker will helpfully create a DIRECTORY there):
      #   - ${HOME}/.local/share/opencode/auth.json:/home/turnstone/.local/share/opencode/auth.json:ro
      # Which agent dispatch_agent picks when the caller doesn't say:
      PEBBLE_DEFAULT_AGENT: ${PEBBLE_DEFAULT_AGENT:-${TURNSTONE_DEFAULT_AGENT:-}}
      PEBBLE_NODE_ID: node-1
      PEBBLE_ADVERTISE_URL: http://node-1:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - turnstone-net
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_healthy
      # Wait for the store to be seeded: one writer, then N readers.
      nix-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  node-2:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-2, PEBBLE_ADVERTISE_URL: "http://node-2:8080" }
  node-3:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-3, PEBBLE_ADVERTISE_URL: "http://node-3:8080" }
  node-4:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-4, PEBBLE_ADVERTISE_URL: "http://node-4:8080" }
  node-5:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-5, PEBBLE_ADVERTISE_URL: "http://node-5:8080" }
  node-6:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-6, PEBBLE_ADVERTISE_URL: "http://node-6:8080" }
  node-7:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-7, PEBBLE_ADVERTISE_URL: "http://node-7:8080" }
  node-8:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-8, PEBBLE_ADVERTISE_URL: "http://node-8:8080" }
  node-9:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-9, PEBBLE_ADVERTISE_URL: "http://node-9:8080" }
  node-10:
    <<: *node
    environment: { <<: *node-env, PEBBLE_NODE_ID: node-10, PEBBLE_ADVERTISE_URL: "http://node-10:8080" }
